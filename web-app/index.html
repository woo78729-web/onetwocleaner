<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>萬兔專業冷氣清洗</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #eef4fb;
        font-family: Inter, "Microsoft JhengHei", "Segoe UI", sans-serif;
      }
      .app-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: #3d4f60;
      }
      .app-boot__card {
        width: min(100%, 320px);
        padding: 28px 24px;
        text-align: center;
        border-radius: 20px;
        background: #ffffff;
        border: 1px solid rgba(16, 42, 67, 0.12);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      }
      .app-boot__title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
        color: #102a43;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .app-boot__hint {
        margin: 0;
        font-size: 14px;
        color: #3d4f60;
      }
      .app-boot__retry {
        display: none;
        margin: 16px auto 0;
        min-height: 40px;
        padding: 8px 16px;
        border: 0;
        border-radius: 999px;
        background: #007bff;
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .app-boot.is-failed .app-boot__retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" aria-live="polite">
        <div class="app-boot__card">
          <p class="app-boot__title">萬兔專業冷氣清洗</p>
          <p class="app-boot__hint">系統載入中...</p>
          <button type="button" class="app-boot__retry" onclick="location.reload()">重新開啟</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var reloadKey = 'spa-boot-reload-at';

        function showBootFailure(message) {
          var boot = document.querySelector('.app-boot');
          var hint = document.querySelector('.app-boot__hint');

          if (!boot || window.__spaStarted) {
            return;
          }

          boot.classList.add('is-failed');

          if (hint) {
            hint.textContent = message || '系統沒有順利打開，請按重新開啟。';
          }
        }

        function reopenOnce() {
          if (window.__spaStarted) {
            return;
          }

          var at = Number(sessionStorage.getItem(reloadKey) || 0);

          if (!at || Date.now() - at > 20000) {
            sessionStorage.setItem(reloadKey, String(Date.now()));
            var url = new URL(window.location.href);
            url.searchParams.set('boot', String(Date.now()));
            window.location.replace(url.toString());
            return;
          }

          showBootFailure();
        }

        window.addEventListener('error', function (event) {
          var target = event.target;

          if (target && target.tagName === 'SCRIPT') {
            reopenOnce();
          }
        }, true);

        window.setTimeout(function () {
          if (!window.__spaStarted && document.querySelector('.app-boot')) {
            reopenOnce();
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
